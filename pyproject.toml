[project]
name = "scene-media-organizer"
version = "2.0.0"
description = "Watches a folder for new media files, identifies them, and organizes them into movie/series libraries."
readme = "readme.md"
requires-python = ">=3.13"
dependencies = [
    "requests==2.34.2",
    "watchdog==6.0.0",
    "py7zr==1.1.3",
    "simple-log-factory==1.0.0",
    "simple-log-factory-ext-otel[requests,psycopg]==1.5.0",
    "python-dotenv==1.2.3",
    "pillow==12.3.0",
    "paho-mqtt==2.1.0",
    "raccoontools==3.6.0",
    "raccoontools-db==1.0.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
