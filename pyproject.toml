[project]
name = "scene-media-organizer"
version = "3.0.0"
description = "Watches a folder for new media files, identifies them, and organizes them into movie/series libraries."
readme = "readme.md"
requires-python = ">=3.14"
dependencies = [
    "infisicalsdk==1.3.0",
    "opentelemetry-api==1.45.2",
    "paho-mqtt==2.2.0",
    "pillow==13.0.0",
    "psycopg[binary]==3.3.8",
    "py7zr==1.1.4",
    "python-dotenv==1.2.4",
    "raccoontools==3.7.0",
    "raccoontools-db==1.1.0",
    "requests==2.34.2",
    "simple-log-factory-ext-otel[psycopg,requests]==2.0.0",
    "watchdog==7.1.0",
]

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.4",
    "types-requests==2.33.0.20261030",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.ruff.lint.per-file-ignores]
# The entry points apply configuration before importing src modules, because several of them read the environment
# at import time.
"main.py" = ["E402"]
"on_demand.py" = ["E402"]

[tool.mypy]
python_version = "3.14"
# Production runs on Linux (python:3.14-slim); type-check against the deployment target.
platform = "linux"
strict = true
warn_unused_ignores = true
# The OTEL trace and raccoontools retry decorators are untyped, so under strict every decorated function would be
# flagged. Their signatures cannot be typed here.
disallow_untyped_decorators = false
files = ["src", "main.py", "on_demand.py", "healthcheck.py", "tests"]

[[tool.mypy.overrides]]
# Fully or partly annotated, but they ship no py.typed marker.
module = ["simple_log_factory_ext_otel.*", "raccoontools.*", "raccoontools_db.*", "infisical_sdk.*"]
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra"]

[tool.coverage.run]
source_pkgs = ["src"]
branch = true
