[project]
name = "scene-media-organizer"
version = "2.0.0"
description = "Watches a folder for new media files, identifies them, and organizes them into movie/series libraries."
readme = "readme.md"
requires-python = ">=3.13"
dependencies = [
    "requests==2.34.2",
    "watchdog==6.0.0",
    "py7zr==1.1.3",
    "simple-log-factory==1.0.0",
    "simple-log-factory-ext-otel[requests,psycopg]==1.5.0",
    "python-dotenv==1.2.3",
    "pillow==12.3.0",
    "paho-mqtt==2.1.0",
    "raccoontools==3.6.0",
    "raccoontools-db==1.0.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=4.0",
    "black>=23.0",
    "isort>=5.0",
    "mypy>=1.0",
    "ruff>=0.15.1",
]

[tool.black]
line-length = 120
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 120

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.mypy]
python_version = "3.13"
# Production runs on Linux (python:3.13-slim); type-check against the deployment target.
platform = "linux"
disallow_untyped_defs = true
strict = true
# The OTEL trace and raccoontools retry decorators ship no type stubs, so under strict
# every decorated function would be flagged. Their signatures cannot be typed here.
disallow_untyped_decorators = false
files = ["src", "main.py", "on_demand.py", "healthcheck.py"]

[[tool.mypy.overrides]]
module = [
    "simple_log_factory_ext_otel.*",
    "raccoontools.*",
    "raccoontools_db.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-v"
testpaths = ["tests"]
pythonpath = ["."]
