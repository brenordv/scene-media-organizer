name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked

      - name: Black
        run: uv run black --check .

      - name: isort
        run: uv run isort --check .

      - name: Ruff
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked

      # The house standard also gates coverage with --cov-fail-under=80. The
      # suite currently covers config and helpers only, so that gate is left off
      # for now; add --cov-fail-under=80 once coverage reaches the bar, otherwise
      # CI would fail on the existing untested modules.
      - name: Run tests
        run: uv run pytest --cov=src --cov-report=term-missing
