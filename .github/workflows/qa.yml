name: QA

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  qa:
    name: Lint, type check and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true

      # Installs the Python version in .python-version and the dev dependency group from uv.lock.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      # The suite replaces Postgres, MQTT, Infisical and the HTTP services with fakes, so no secrets or services are
      # needed.
      - name: Tests
        run: uv run pytest --cov
